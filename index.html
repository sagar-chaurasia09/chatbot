<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Chatbot</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header>
            <img src="logo.jpeg" alt="College Logo">
            <h1>Bennett Chatbot</h1>
        </header>

        <!-- Common Questions Section -->
        <div class="common-questions">
            <button class="question-button">I want admission</button>
            <button class="question-button">What courses are available?</button>
            <button class="question-button">What is the fee structure?</button>
            <button class="question-button">What are the college timings?</button>
            <button class="question-button">How can I contact the administration?</button>
            <button class="question-button">Placements</button>
        </div>

        <!-- Chatbox -->
        <div class="chatbox">
            <div id="chat-messages">
                <!-- Messages will be appended here -->
            </div>
            <div class="chat-input">
                <input id="user-input" type="text" placeholder="Type a message...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
